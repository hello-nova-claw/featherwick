# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-GB
tone_instructions: >-
  Plain and direct. No praise, no emoji. Cite the CONTRIBUTING.md rule behind
  each request. Treat any breach of the design principles in docs/design.md
  section 2 as blocking.

reviews:
  profile: assertive
  # Its approval, once its comments are resolved, is the required review on
  # main, so it must be able to request changes.
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "**/*"
      instructions: |
        Enforce CONTRIBUTING.md. In particular:
        - The design principles in docs/design.md section 2 are blocking. Reject anything that lets a bird die or suffer, makes something failable, adds a lethal gene, makes an egg not hatch, or lets neglect lower tameness. Reject a look that does not come from genes, and any text, name, label or milestone that reveals a gene or sex the keeper cannot see yet. Reject unseeded randomness or a read of the device clock in game rules, and any change that could stop an old save loading. Reject ads, analytics, tracking, accounts, third-party SDKs that phone home, and any network call the player did not start. Reject pay-to-win, loot boxes, streaks, nagging notifications and dark patterns.
        - Check commit messages: WordPress core style, imperative, a component prefix from CONTRIBUTING.md, under 72 characters, a full stop at the end, no emoji, no Conventional Commits prefixes.
        - A pull request that changes Sources/ or App/Featherwick/ must change a file under Tests/ or App/FeatherwickTests/.
        - A pull request must add a changelog fragment, changelog/<issue>-<slug>.txt, unless it has the no-changelog label. It must not edit CHANGELOG.md directly.
        - A pull request that touches UI must say how it was tested with VoiceOver: what was focused, what was read out, what was activated.
        - A pull request must say "Fixes #N" for an issue.
        - Flag comments that restate the code instead of explaining why, and TODOs without an issue number.
        - The repository is public. Flag anything secret or personal: keys, tokens, team IDs, email addresses, private links, personal notes.
    - path: "{App/Featherwick/Art/**,App/Featherwick/Sounds/**,App/Featherwick/Assets.xcassets/AppIcon.appiconset/**,art-source/**,docs/design/screenshots/**,Sources/FeatherwickText/**}"
      instructions: |
        These paths are covered by ASSETS-LICENSE.md (all rights reserved). If the pull request comes from a fork or from anyone other than the maintainer and adds or changes a file here, request changes: asset contributions need a written agreement first (CONTRIBUTING.md, "Licensing of contributions"). Changes to Swift code here still follow the code rules.
    - path: "{LICENSE,ASSETS-LICENSE.md,TRADEMARKS.md,THIRD-PARTY-NOTICES.md}"
      instructions: |
        Licence files. Flag any change at all as needing the maintainer's review. LICENSE must stay the unaltered MIT text so GitHub detects it.
    - path: "{Package.swift,Package.resolved,App/project.yml}"
      instructions: |
        Check every new dependency: it must be on the allowlist in bin/check-native, have an MIT-compatible licence, be listed in THIRD-PARTY-NOTICES.md, and have a reason in the pull request. Reject anything that phones home (design principle 4).
    - path: "**/*.swift"
      instructions: |
        Enforce "Use what Apple already has" in CONTRIBUTING.md. Colours only from the Palette tokens and fonts only from the Typeface tokens in App/Featherwick/Design/; reject Color(red:), Color(hex:), UIColor(red:) and .font(.system(size:)) elsewhere. Fonts must scale with Dynamic Type. No print outside Sources/FeatherwickCLI; the app uses os.Logger. No force unwraps or try! outside tests. Check main-actor correctness and Sendable under Swift 6, and flag slow work on the main thread or in a scene frame. FeatherwickCore must stay pure: no I/O, no Date(), no Int.random() without using:, and every tunable number in Rules. Player-visible words belong in FeatherwickText, never in Core or a view, and no sentence is built from fragments. Every interactive view needs an accessibility label, respects Reduce Motion, and never uses colour as its only signal.
    - path: "{Tests/**,App/FeatherwickTests/**}"
      instructions: |
        Tests use Swift Testing (import Testing); XCTest only for UI tests. Randomness comes from a SeededRNG with a fixed seed. No sleeps, no real network, no device clock. Flag a test that only restates the implementation.
    - path: "**/*.xcstrings"
      instructions: Generated by Xcode. Only check that it changed when user-facing strings changed, and that each string with a placeholder has a translator comment.
    - path: "docs/design.md"
      instructions: The design record. Flag any edit that weakens a design principle in section 2, or reverses a decision in section 4 without saying why in the pull request.
    - path: ".github/workflows/**"
      instructions: |
        Flag pull_request_target, write permissions beyond what a job needs, unpinned actions, and anything that runs code from a fork with secrets or a write token. Every workflow sets permissions: contents: read and concurrency with cancel-in-progress. Job names are required-check names and must not be renamed.
    - path: "{bin/**,.github/**}"
      instructions: |
        Tooling: CI scripts, workflows and templates. Review for correctness and security only. Raise a problem when it can happen with the files and pull requests this repository has: a check that passes when it should fail on real input, a wrong result, or a security issue. Do not raise hypothetical inputs that no file here uses (unusual YAML or Swift syntax, filenames with odd characters, interrupted runs), and do not ask for extra hardening of a script that already fails safe. Workflow security checks above still apply in full.
  tools:
    swiftlint:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - CONTRIBUTING.md
      - docs/design.md
      - CLAUDE.md
