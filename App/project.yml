# XcodeGen spec for the iOS test app. Generate the Xcode project with:
#   brew install xcodegen   (once)
#   cd App && xcodegen
# The .xcodeproj is generated and git-ignored: change this file, not the project.
name: Featherwick
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Featherwick:
    path: ..
targets:
  Featherwick:
    type: application
    platform: iOS
    # Every file under Featherwick/ is built in: Swift and Metal (Scene/SeasonRamp.metal, into the
    # default shader library) as code, the rest (fonts, Sounds/*.caf, Art/Scene/*.png) as resources,
    # copied flat to the bundle root, so every file name must be unique. The READMEs are notes for people, so they stay out
    # (two README.md files at the bundle root would also clash).
    sources:
      - path: Featherwick
        excludes:
          - "**/*.md"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    # A shared scheme for the app. Without it, Xcode lists only the package's schemes (the
    # `featherwick` CLI among them), and running that on an iPhone fails with "not codesigned".
    scheme: {}
    dependencies:
      - package: Featherwick
        product: FeatherwickCore
      - package: Featherwick
        product: FeatherwickText
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Featherwick
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
