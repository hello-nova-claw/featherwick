# XcodeGen spec for the iOS test app. Generate the Xcode project with:
#   brew install xcodegen   (once)
#   cd App && xcodegen
# The .xcodeproj is generated and git-ignored: change this file, not the project.
name: Featherwick
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
# Beta is Release plus the BETA flag: the build for TestFlight. It compiles in the beta questions
# (App/Featherwick/Beta). Release, the App Store build, never has them. Archive with the
# "Featherwick Beta" scheme for TestFlight, and with "Featherwick" for the App Store.
configs:
  Debug: debug
  Release: release
  Beta: release
packages:
  Featherwick:
    path: ..
targets:
  Featherwick:
    type: application
    platform: iOS
    # Every file under Featherwick/ is built in: Swift and Metal (Scene/SeasonRamp.metal, into the
    # default shader library) as code, the rest (fonts, Sounds/*.caf, Art/Scene/*.png) as resources,
    # copied flat to the bundle root, so every file name must be unique. The READMEs are notes for people, so they stay out
    # (two README.md files at the bundle root would also clash).
    sources:
      - path: Featherwick
        excludes:
          - "**/*.md"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
      Beta: Config/Signing.xcconfig
    dependencies:
      - package: Featherwick
        product: FeatherwickCore
      - package: Featherwick
        product: FeatherwickText
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Featherwick
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      configs:
        Beta:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) BETA"
# Shared schemes for the app. Without them, Xcode lists only the package's schemes (the
# `featherwick` CLI among them), and running that on an iPhone fails with "not codesigned".
# Each config is named here, because with two release-type configs XcodeGen could pick Beta for an archive.
schemes:
  # The everyday and App Store scheme: Debug to run, Release to archive. No beta questions in Release.
  Featherwick:
    build:
      targets:
        Featherwick: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # The TestFlight scheme: runs and archives the Beta configuration (see `configs` above).
  Featherwick Beta:
    build:
      targets:
        Featherwick: all
    run:
      config: Beta
    profile:
      config: Beta
    analyze:
      config: Beta
    archive:
      config: Beta
