name: Screenshots comment

# Posts the Screenshots comment and keeps the images on the screenshots branch, under pr-<number>/.
# It runs after the Screenshots workflow, from main's copy of this file. It never checks out or runs pull
# request code: it reads only the artifact, and checks that it holds nothing but PNGs and the change list.
on:
  workflow_run:
    workflows: [Screenshots]
    types: [completed]

permissions:
  contents: read

# One group per pull request: a newer run for the same pull request replaces an older one, and runs for
# different pull requests never cancel each other. They can push to the screenshots branch at the same time,
# so the push below retries; each writes only its own pr-<n>/ folder, so the retries never conflict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  comment:
    name: Screenshots comment
    # Only pull requests from this repository: a fork's run carries no pull request here.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      # Runs for one pull request can finish out of order. Only the run for its current head publishes,
      # so an older run never replaces newer images or a newer comment.
      - name: This run is for the pull request's current head
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          now=$(gh api "repos/${REPO}/pulls/${PR}" --jq .head.sha)
          if [ "$now" = "$HEAD_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: this run is for ${HEAD_SHA:0:7}, but the pull request is now at ${now:0:7}."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.current.outputs.publish == 'true'
        with:
          name: screenshots
          path: shots
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Check the artifact holds only screenshots
        if: steps.current.outputs.publish == 'true'
        run: |
          bad=$(find shots -type f | grep -vE '^shots/(changes\.json|(before|after)/[a-z0-9-]+--[a-z0-9-]+--[a-zA-Z0-9-]+--[a-z0-9-]+\.png)$' || true)
          if [ -n "$bad" ]; then echo "::error::Unexpected files in the artifact: $bad"; exit 1; fi
          find shots -name '*.png' -print0 | while IFS= read -r -d '' f; do
            head -c 8 "$f" | od -An -tx1 | tr -d ' \n' | grep -qx '89504e470d0a1a0a' || { echo "::error::$f is not a PNG"; exit 1; }
          done
          # The comment quotes these names, so each must be a list of shot file names and nothing else.
          python3 - <<'PY'
          import json, re, sys
          shot = re.compile(r"[a-z0-9-]+--[a-z0-9-]+--[a-zA-Z0-9-]+--[a-z0-9-]+\.png")
          c = json.load(open("shots/changes.json"))
          keys = {"changed", "added", "removed", "unchanged"}
          if not isinstance(c, dict) or set(c) != keys:
              sys.exit(f"::error::changes.json must have exactly the keys {sorted(keys)}")
          for key in keys:
              if not isinstance(c[key], list) or not all(isinstance(n, str) and shot.fullmatch(n) for n in c[key]):
                  sys.exit(f"::error::changes.json {key} must be a list of shot file names")
          # Every listed shot must have its image on the side the comment shows it from.
          import os
          sides = {"changed": ["before", "after"], "added": ["after"], "removed": ["before"]}
          for key, needed in sides.items():
              for name in c[key]:
                  for side in needed:
                      if not os.path.isfile(f"shots/{side}/{name}"):
                          sys.exit(f"::error::changes.json lists {name} as {key}, but shots/{side}/{name} is missing")
          PY
      - name: Store the shots on the screenshots branch
        if: steps.current.outputs.publish == 'true'
        id: store
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          git init -q store && cd store
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          # Another pull request's run may push first. Then start again from the new tip: this run only
          # replaces its own pr-<n>/ folder, so nothing of the other run's is lost.
          for attempt in 1 2 3 4 5; do
            if git ls-remote --exit-code --heads "$remote" screenshots >/dev/null; then
              git fetch -q --depth 1 "$remote" screenshots && git checkout -q -B screenshots FETCH_HEAD
            else
              git checkout -q --orphan screenshots
            fi
            rm -rf "pr-${PR}" && mkdir -p "pr-${PR}"
            cp -R ../shots/before ../shots/after "pr-${PR}/" 2>/dev/null || true
            git add -A
            git commit -q --allow-empty -m "Screenshots for #${PR} at ${HEAD_SHA:0:7}."
            # Checked again just before writing: the pull request may have moved on since the first check.
            if [ "$(gh api "repos/${REPO}/pulls/${PR}" --jq .head.sha)" != "$HEAD_SHA" ]; then
              echo "Skipping: the pull request moved on from ${HEAD_SHA:0:7} while this run was going."
              echo "sha=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git push -q "$remote" screenshots; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Push attempt $attempt was rejected; trying again from the new tip."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the screenshots after 5 attempts."
          exit 1
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        # An empty sha means the store step stopped because the pull request moved on.
        if: steps.current.outputs.publish == 'true' && steps.store.outputs.sha != ''
        env:
          STORE_SHA: ${{ steps.store.outputs.sha }}
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            const pr = run.pull_requests[0].number;
            // Checked once more just before writing the comment.
            const { data: now } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: pr });
            if (now.head.sha !== run.head_sha) {
              core.info(`Skipping: the pull request moved on from ${run.head_sha.slice(0, 7)}.`);
              return;
            }
            const c = JSON.parse(fs.readFileSync('shots/changes.json', 'utf8'));
            const base = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${process.env.STORE_SHA}/pr-${pr}`;
            const img = (side, name) => `<img src="${base}/${side}/${name}" width="240" alt="${name}">`;
            const title = (name) => '`' + name.replace(/\.png$/, '') + '`';
            const marker = '<!-- featherwick-screenshots -->';
            const lines = [marker, '### Screenshots', '',
              `This pull request at ${run.head_sha.slice(0, 7)}, compared with \`${run.pull_requests[0].base.ref}\`: ${c.changed.length} changed, ${c.added.length} new, ` +
              `${c.removed.length} gone, ${c.unchanged.length} unchanged. A change never fails the check; look before you approve.`, ''];
            const shown = 40;
            if (c.changed.length) {
              lines.push('#### Changed', '', '| Shot | Before | After |', '| --- | --- | --- |');
              for (const n of c.changed.slice(0, shown)) lines.push(`| ${title(n)} | ${img('before', n)} | ${img('after', n)} |`);
              lines.push('');
            }
            if (c.added.length) {
              lines.push('#### New', '', '| Shot | After |', '| --- | --- |');
              for (const n of c.added.slice(0, shown)) lines.push(`| ${title(n)} | ${img('after', n)} |`);
              lines.push('');
            }
            if (c.removed.length) {
              lines.push('#### Gone', '', '| Shot | Before |', '| --- | --- |');
              for (const n of c.removed.slice(0, shown)) lines.push(`| ${title(n)} | ${img('before', n)} |`);
              lines.push('');
            }
            if ([c.changed, c.added, c.removed].some((l) => l.length > shown)) {
              lines.push(`Only the first ${shown} of each list are shown. All are in \`pr-${pr}/\` on the \`screenshots\` branch.`, '');
            }
            lines.push('<details><summary>Unchanged</summary>', '', ...c.unchanged.map((n) => `- ${title(n)}`), '', '</details>');
            const body = lines.join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: pr,
            });
            // Only the bot's own comment: anyone can paste the marker into theirs.
            const mine = comments.find((x) => x.user?.login === 'github-actions[bot]' && x.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: pr, body });
            }
