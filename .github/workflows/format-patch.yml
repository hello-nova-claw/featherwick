# Temporary: runs swift format once and publishes the patch. Removed in the next commit.
name: Format patch
on: pull_request
jobs:
  patch:
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v5
      - run: swift format --version
      - run: swift format --in-place --recursive --parallel Package.swift Sources Tests
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE" && git diff --stat && git diff > format.patch
      - uses: actions/upload-artifact@v4
        with: { name: format-patch, path: format.patch }
      - name: Patch as base64 (fallback)
        run: echo "BEGIN-PATCH"; gzip -9c format.patch | base64 -w 100; echo "END-PATCH"
