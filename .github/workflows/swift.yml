name: Swift

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch or PR stops the run still going for the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          swift format --in-place --recursive --parallel Package.swift Sources Tests
          git diff --exit-code || { echo "::error::Run: swift format --in-place --recursive Package.swift Sources Tests"; exit 1; }
      - uses: actions/cache@v4
        with:
          path: .build
          key: linux-spm-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: linux-spm-
      - name: Build (warnings are errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test --skip-build
