name: Swift

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch or PR stops the run still going for the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: .build
          key: linux-spm-${{ hashFiles('Package.swift', 'Sources/**', 'Tests/**') }}
          restore-keys: linux-spm-
      - name: Build (warnings are errors)
        run: swift build --build-tests -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test --skip-build
      # Last, so one run reports build, tests and formatting. The diff shows what to change.
      - name: Check formatting
        if: always()
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          swift format --in-place --recursive --parallel Package.swift Sources Tests App
          git diff --exit-code || { echo "::error::Run: swift format --in-place --recursive Package.swift Sources Tests App"; exit 1; }
