name: Pull request rules

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Job names are required-check names on main. Never rename one.
jobs:
  tests-with-code:
    name: Tests change with code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          if grep -qE '^(Sources|App/Featherwick)/' <<<"$changed" \
            && ! grep -qE '^(Tests|App/FeatherwickTests|App/FeatherwickUITests)/' <<<"$changed"; then
            echo "::error::This pull request changes Sources/ or App/Featherwick/ but no file under Tests/, App/FeatherwickTests/ or App/FeatherwickUITests/. Write the test first."
            exit 1
          fi

  changelog:
    name: Changelog fragment
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          fragments=$(git diff --name-only --diff-filter=AM "origin/${BASE_REF}...HEAD" | grep -E '^changelog/[1-9][0-9]*-[^/]+\.txt$' || true)
          if [ -z "$fragments" ]; then
            echo "::error::Add a changelog fragment, changelog/<issue>-<slug>.txt, with one line a player would understand, or ask the maintainer for the no-changelog label."
            exit 1
          fi
          for f in $fragments; do
            lines=$(grep -c '[^[:space:]]' "$f" || true)
            if [ "$lines" -ne 1 ]; then
              echo "::error file=$f::A changelog fragment holds exactly one line a player would understand; this one has $lines."
              exit 1
            fi
          done
