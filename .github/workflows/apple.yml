name: Apple

# macOS minutes cost 10x Linux minutes on a private repo, so this runs on main only.
# Run it by hand (Actions → Apple → Run workflow) to check a branch before merging.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-and-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift --version
      - name: Build and test on macOS (warnings are errors)
        run: |
          swift build --build-tests -Xswiftc -warnings-as-errors
          swift test --skip-build
      - name: Build the core for iOS
        run: xcodebuild build -scheme FeatherwickCore -destination 'generic/platform=iOS Simulator' -quiet
      - name: Build the iOS app (App/project.yml)
        run: |
          brew install xcodegen
          cd App && xcodegen
          xcodebuild build -project Featherwick.xcodeproj -scheme Featherwick \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet
      - name: Build the iOS app tests (App/FeatherwickTests)
        working-directory: App
        run: |
          xcodebuild build-for-testing -project Featherwick.xcodeproj -scheme Featherwick \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet
