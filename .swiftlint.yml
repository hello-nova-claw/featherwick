# SwiftLint checks the few rules swift-format cannot. swift-format owns layout and style.
# Old violations are recorded in .swiftlint-baseline.json; only new ones fail. Remove an
# entry by fixing it, never add one to get a pull request through.
only_rules:
  - custom_rules
  - force_cast
  - force_try
  - force_unwrapping
  - inclusive_language
  - optional_data_string_conversion
  - unused_closure_parameter
  - void_function_in_ternary
included:
  - Sources
  - App/Featherwick
excluded:
  - Tests
  - App/FeatherwickTests

# "Use what Apple already has" (CONTRIBUTING.md). SourceKit tells code from comments and strings, so
# text that only looks like a call is never flagged. Known uses sit in the baseline, each explained in
# CONTRIBUTING.md; a new one fails.
custom_rules:
  native_colour:
    name: Use what Apple already has (colour)
    regex: '\b(?:Color(?:\.init)?\((?:red|hex|white):|UIColor(?:\.init)?\((?:red|white|hue):|Color(?:\.init)?\(\s*\.sRGB)'
    excluded_match_kinds: [comment, comment.mark, comment.url, doccomment, doccomment.field, string]
    excluded: ['App/Featherwick/Design/']
    message: A hard-coded colour. Use a Palette token from App/Featherwick/Design/.
    severity: error
  native_font_size:
    name: Use what Apple already has (font size)
    regex: '\.system\(size:'
    excluded_match_kinds: [comment, comment.mark, comment.url, doccomment, doccomment.field, string]
    message: A fixed font size. Use a Typeface token that scales with Dynamic Type.
    severity: error
  native_print:
    name: Use what Apple already has (print)
    regex: '(?:(?<![\w.])|\bSwift\.)print\('
    excluded_match_kinds: [comment, comment.mark, comment.url, doccomment, doccomment.field, string]
    excluded: ['Sources/FeatherwickCLI/']
    message: print. Use os.Logger in the app; Core and Text never print.
    severity: error
